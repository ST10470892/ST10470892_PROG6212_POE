
name: RaceDay CI Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build and Test RaceDay
    runs-on: ubuntu-latest

    steps:
      # Download repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install .NET 8
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Restore dependencies
      - name: Restore Dependencies
        run: dotnet restore RaceDay.sln

      # Build application
      - name: Build Project
        run: dotnet build RaceDay.sln --configuration Release --no-restore

      # Run unit tests
      - name: Run Unit Tests
        run: dotnet test RaceDay.sln --configuration Release --no-build --verbosity normal
